services:
  postgres:
    image: postgres:16-alpine
    container_name: social-insight-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: social_insight
      POSTGRES_PASSWORD: social_insight
      POSTGRES_DB: social_insight
      # Everything in the database is stored in UTC; Asia/Bangkok is a
      # presentation concern only (see lib/datetime.ts).
      TZ: UTC
      PGTZ: UTC
    ports:
      # 5433 on the host so this never collides with a Postgres already
      # installed on the machine (XAMPP boxes often have one).
      - "5433:5432"
    volumes:
      - social-insight-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_insight -d social_insight"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  social-insight-pgdata:
