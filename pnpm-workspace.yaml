# pnpm 10+ moved settings out of package.json into this file (it is read even
# when the repo is not a workspace).
#
# Postinstall scripts are blocked by default. These five need them:
#   prisma / @prisma/client / @prisma/engines  download the query engine binary
#   esbuild                                    fetches its platform binary (vitest)
#   unrs-resolver                              native resolver used by eslint
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  unrs-resolver: true
